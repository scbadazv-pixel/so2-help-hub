<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOPLAY — Игровая торговая площадка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f17;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Шапка */
        header {
            background-color: #121824;
            border-bottom: 1px solid #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo-icon {
            color: #f59e0b;
            font-size: 1.1rem;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            gap: 15px;
        }
        .nav-link {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            color: #38bdf8;
        }
        
        .user-panel {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .balance-box {
            background: #192231;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #2a3649;
            font-weight: 700;
            color: #4ade80;
            font-size: 0.85rem;
        }
        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
        }

        /* Контейнер */
        .main-container {
            max-width: 650px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: #f8fafc;
        }
        .page-subtitle {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .content-section {
            display: none;
        }
        .content-section.active {
            display: block;
        }

        /* Сетка маркета */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .item-card {
            background: #141b26;
            border-radius: 10px;
            border: 1px solid #1e293b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }
        .item-card:hover {
            border-color: #38bdf8;
        }
        .item-img-wrap {
            width: 100%;
            height: 140px;
            background: #0b0f17;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .item-img-wrap img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        .item-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .item-title {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: #f1f5f9;
        }
        .item-wear {
            font-size: 0.7rem;
            color: #64748b;
            margin-bottom: 8px;
        }
        .item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .item-price {
            font-size: 0.95rem;
            font-weight: 800;
            color: #4ade80;
        }
        .btn-action {
            background-color: #38bdf8;
            color: #0b0f17;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-action:hover {
            background-color: #0ea5e9;
        }

        /* Профиль */
        .profile-card {
            background: #141b26;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .profile-card img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
        }
        .profile-info h2 {
            font-size: 1.1rem;
            margin-bottom: 3px;
        }
        .profile-info p {
            color: #64748b;
            font-size: 0.8rem;
        }

        /* Форма */
        .form-card {
            background: #141b26;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
        }
        .form-card h3 {
            color: #38bdf8;
            margin-bottom: 12px;
            font-size: 1.05rem;
        }
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #2a3649;
            background: #0b0f17;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.85rem;
        }
        .btn-submit {
            width: 100%;
            background: #4ade80;
            color: #0b0f17;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo-area">
            <span class="logo-icon">⚡</span>
            <div class="logo">STOPLAY</div>
        </div>
        <div class="nav-links">
            <span class="nav-link active" onclick="switchTab('market', this)">Маркет</span>
            <span class="nav-link" onclick="switchTab('inventory', this)">Инвентарь</span>
            <span class="nav-link" onclick="switchTab('sell', this)">Продать</span>
            <span class="nav-link" onclick="switchTab('profile', this)">Профиль</span>
        </div>
        <div class="user-panel">
            <div class="balance-box" id="user-balance">14,250 ₽</div>
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" alt="Avatar" class="user-avatar">
        </div>
    </header>

    <div class="main-container">

        <!-- МАРКЕТ -->
        <div id="section-market" class="content-section active">
            <div class="page-title">Торговая площадка</div>
            <div class="page-subtitle">Мгновенная покупка и продажа предметов</div>
            <div class="market-grid" id="market-container"></div>
        </div>

        <!-- ИНВЕНТАРЬ -->
        <div id="section-inventory" class="content-section">
            <div class="page-title">Мой инвентарь</div>
            <div class="page-subtitle">Ваши активные игровые скины</div>
            <div class="market-grid" id="inventory-container"></div>
        </div>

        <!-- ПРОДАТЬ -->
        <div id="section-sell" class="content-section">
            <div class="form-card">
                <h3>Выставить предмет</h3>
                <form id="sellForm">
                    <div class="form-group">
                        <label>Название предмета:</label>
                        <input type="text" id="itemName" placeholder="AK-12 | Carbon" required>
                    </div>
                    <div class="form-group">
                        <label>Состояние:</label>
                        <input type="text" id="itemWear" placeholder="Прямо с завода" required>
                    </div>
                    <div class="form-group">
                        <label>Ссылка на картинку (URL):</label>
                        <input type="url" id="itemImg" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>Цена (₽):</label>
                        <input type="number" id="itemPrice" placeholder="1500" required>
                    </div>
                    <button type="submit" class="btn-submit">Опубликовать</button>
                </form>
            </div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="section-profile" class="content-section">
            <div class="profile-card">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" alt="Avatar">
                <div class="profile-info">
                    <h2>ProTrader_99</h2>
                    <p>ID аккаунта: #844105</p>
                    <p>Статус: <span style="color: #4ade80;">Верифицирован</span></p>
                </div>
            </div>
        </div>

    </div>

    <script>
        function switchTab(tabName, element) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            document.getElementById('section-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        let marketItems = [
            { name: "AKr | Carbon", wear: "Прямо с завода", price: 1450, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot621FBRw7PvNYjoW09m5lpKKqPv9NLPF2G5VppMl3rGEoNOi2wO2qBBuZjzycYOQIwdrZwzU-lfvw7u8g8S0vpvInHEyuic8pCrd2A24hw/300fx300f" },
            { name: "M4 | Samurai", wear: "Немного поношенное", price: 3200, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot7HxfDhjxszJemkV086jloj0m_7zO6-LuGhD18p0juW-_Mu8j1G1tBk9NmymIoOSJg86Y1mCqAC_krju3sbtu8udy3JkuHIn4CvblxW1hE0ZbrY-0vuT9w/300fx300f" },
            { name: "Butterfly | Dragon", wear: "Прямо с завода", price: 24500, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpovbSsLQJf2PLacDBA5ciJnJm0g_7zO6-LuGhD18p0jeHVu9n22wK2qBBuZjzycYOQIwdrZwzU-lfvw7u8g8S0vpvInHEyuic8pCrd2A24hw/300fx300f" },
            { name: "USP | Flash", wear: "После полевых", price: 850, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpoo6m1FBRp3_bGcjhQ09-jq5WYh8j5Nr_Yg2YfcZ0q2u-VoYr22lCyqBY9amv1JoCSIlc3NQ3Ur1C6krq5gpXuvcjInXVhu3R05CremBe2101Ebrdtg-a1Vw/300fx300f" }
        ];

        let userInventory = [];
        let balance = 14250;

        const marketContainer = document.getElementById('market-container');
        const inventoryContainer = document.getElementById('inventory-container');
        const balanceEl = document.getElementById('user-balance');

        function renderMarket() {
            marketContainer.innerHTML = '';
            marketItems.forEach((item, index) => {
                marketContainer.innerHTML += `
                    <div class="item-card">
                        <div class="item-img-wrap">
                            <img src="${item.img}" alt="${item.name}">
                        </div>
                        <div class="item-body">
                            <div>
                                <div class="item-title">${item.name}</div>
                                <div class="item-wear">${item.wear}</div>
                            </div>
                            <div class="item-footer">
                                <div class="item-price">${item.price.toLocaleString()} ₽</div>
                                <button class="btn-action" onclick="buyItem(${index})">Купить</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderInventory() {
            inventoryContainer.innerHTML = '';
            if (userInventory.length === 0) {
                inventoryContainer.innerHTML = '<p style="color: #64748b; grid-column: span 2; text-align: center; padding: 20px; font-size: 0.85rem;">Инвентарь пуст</p>';
                return;
            }
            userInventory.forEach((item, index) => {
                inventoryContainer.innerHTML += `
                    <div class="item-card">
                        <div class="item-img-wrap">
                            <img src="${item.img}" alt="${item.name}">
                        </div>
                        <div class="item-body">
                            <div>
                                <div class="item-title">${item.name}</div>
                                <div class="item-wear">${item.wear}</div>
                            </div>
                            <div class="item-footer">
                                <div class="item-price">${item.price.toLocaleString()} ₽</div>
                                <button class="btn-action" style="background:#4ade80;" onclick="withdrawItem(${index})">Вывести</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function buyItem(index) {
            const item = marketItems[index];
            if (balance >= item.price) {
                balance -= item.price;
                balanceEl.innerText = balance.toLocaleString() + ' ₽';
                userInventory.push(item);
                marketItems.splice(index, 1);
                renderMarket();
                renderInventory();
                alert(`Успешно приобретено: ${item.name}!`);
            } else {
                alert('Недостаточно средств!');
            }
        }

        function withdrawItem(index) {
            alert(`Запрос на вывод "${userInventory[index].name}" отправлен.`);
            userInventory.splice(index, 1);
            renderInventory();
        }

        document.getElementById('sellForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('itemName').value;
            const wear = document.getElementById('itemWear').value;
            const img = document.getElementById('itemImg').value;
            const price = Number(document.getElementById('itemPrice').value);

            marketItems.unshift({ name, wear, price, img });
            renderMarket();
            switchTab('market', document.querySelectorAll('.nav-link')[0]);
            alert('Предмет успешно выставлен!');
            this.reset();
        });

        renderMarket();
        renderInventory();
    </script>
</body>
</html>
