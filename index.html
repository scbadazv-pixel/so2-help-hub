<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOPLAY — Marketplace</title>
    <style>
        :root {
            --bg-main: #0c1017;
            --bg-card: #131822;
            --bg-header: #0f141d;
            --accent: #f59e0b;
            --accent-blue: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --border: #1e293b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Шапка Stoplay */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
            height: 60px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 1.25rem;
            letter-spacing: 1px;
            color: var(--text-main);
            text-transform: uppercase;
        }
        .brand span {
            color: var(--accent);
        }

        .nav-menu {
            display: flex;
            gap: 24px;
        }
        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--accent-blue);
        }

        .user-zone {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .wallet {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            color: #4ade80;
            font-size: 0.85rem;
        }
        .avatar-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent-blue);
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Основной контейнер */
        .wrapper {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .section-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Игровая сетка */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
        }
        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }
        .product-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }
        .product-img {
            width: 100%;
            height: 150px;
            background: #090c10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .product-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .p-name {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }
        .p-wear {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .p-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .p-price {
            font-weight: 800;
            color: #4ade80;
            font-size: 1rem;
        }
        .btn-buy {
            background: var(--accent-blue);
            color: #0c1017;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-buy:hover {
            background: #0ea5e9;
        }

        /* Формы */
        .form-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            max-width: 480px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: #fff;
            font-size: 0.9rem;
        }
        .btn-main {
            width: 100%;
            background: #4ade80;
            color: #0c1017;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span>⚡</span> STO<span>PLAY</span>
        </div>
        <div class="nav-menu">
            <span class="nav-item active" onclick="switchTab('market', this)">Маркет</span>
            <span class="nav-item" onclick="switchTab('inventory', this)">Инвентарь</span>
            <span class="nav-item" onclick="switchTab('sell', this)">Продать</span>
        </div>
        <div class="user-zone">
            <div class="wallet" id="user-balance">15,400 ₽</div>
            <div class="avatar-container">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" alt="avatar">
            </div>
        </div>
    </header>

    <div class="wrapper">
        <!-- МАРКЕТ -->
        <div id="tab-market" class="tab-content active">
            <div class="section-title">Торговая площадка</div>
            <div class="section-desc">Мгновенные сделки с игровыми предметами</div>
            <div class="items-grid" id="market-grid"></div>
        </div>

        <!-- ИНВЕНТАРЬ -->
        <div id="tab-inventory" class="tab-content">
            <div class="section-title">Инвентарь</div>
            <div class="section-desc">Купленные предметы на вашем балансе</div>
            <div class="items-grid" id="inventory-grid"></div>
        </div>

        <!-- ПРОДАТЬ -->
        <div id="tab-sell" class="tab-content">
            <div class="form-box">
                <div class="section-title" style="font-size: 1.2rem; margin-bottom: 16px;">Выставить на продажу</div>
                <form id="sell-form">
                    <div class="form-group">
                        <label>Название предмета</label>
                        <input type="text" id="s-name" placeholder="АК-12 | Carbon" required>
                    </div>
                    <div class="form-group">
                        <label>Состояние</label>
                        <input type="text" id="s-wear" placeholder="Прямо с завода" required>
                    </div>
                    <div class="form-group">
                        <label>Ссылка на картинку (URL)</label>
                        <input type="url" id="s-img" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>Цена (₽)</label>
                        <input type="number" id="s-price" placeholder="1200" required>
                    </div>
                    <button type="submit" class="btn-main">Выставить предмет</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            el.classList.add('active');
        }

        let marketItems = [
            { name: "AKr | Carbon", wear: "Прямо с завода", price: 1450, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot621FBRw7PvNYjoW09m5lpKKqPv9NLPF2G5VppMl3rGEoNOi2wO2qBBuZjzycYOQIwdrZwzU-lfvw7u8g8S0vpvInHEyuic8pCrd2A24hw/300fx300f" },
            { name: "M4 | Samurai", wear: "Немного поношенное", price: 3200, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot7HxfDhjxszJemkV086jloj0m_7zO6-LuGhD18p0juW-_Mu8j1G1tBk9NmymIoOSJg86Y1mCqAC_krju3sbtu8udy3JkuHIn4CvblxW1hE0ZbrY-0vuT9w/300fx300f" },
            { name: "Butterfly | Dragon", wear: "Прямо с завода", price: 24500, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpovbSsLQJf2PLacDBA5ciJnJm0g_7zO6-LuGhD18p0jeHVu9n22wK2qBBuZjzycYOQIwdrZwzU-lfvw7u8g8S0vpvInHEyuic8pCrd2A24hw/300fx300f" }
        ];
        let inventory = [];
        let balance = 15400;

        function render() {
            const mGrid = document.getElementById('market-grid');
            mGrid.innerHTML = marketItems.map((item, i) => `
                <div class="product-card">
                    <div class="product-img"><img src="${item.img}" alt=""></div>
                    <div class="product-info">
                        <div>
                            <div class="p-name">${item.name}</div>
                            <div class="p-wear">${item.wear}</div>
                        </div>
                        <div class="p-footer">
                            <div class="p-price">${item.price.toLocaleString()} ₽</div>
                            <button class="btn-buy" onclick="buy(${i})">Купить</button>
                        </div>
                    </div>
                </div>
            `).join('');

            const iGrid = document.getElementById('inventory-grid');
            if(inventory.length === 0) {
                iGrid.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem;">Инвентарь пуст</div>';
            } else {
                iGrid.innerHTML = inventory.map((item, i) => `
                    <div class="product-card">
                        <div class="product-img"><img src="${item.img}" alt=""></div>
                        <div class="product-info">
                            <div>
                                <div class="p-name">${item.name}</div>
                                <div class="p-wear">${item.wear}</div>
                            </div>
                            <div class="p-footer">
                                <div class="p-price">${item.price.toLocaleString()} ₽</div>
                                <button class="btn-buy" style="background:#4ade80;" onclick="withdraw(${i})">Вывести</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('user-balance').innerText = balance.toLocaleString() + ' ₽';
        }

        function buy(i) {
            if(balance >= marketItems[i].price) {
                balance -= marketItems[i].price;
                inventory.push(marketItems.splice(i, 1)[0]);
                render();
            } else {
                alert('Недостаточно средств!');
            }
        }

        function withdraw(i) {
            alert('Запрос на вывод отправлен в систему.');
            inventory.splice(i, 1);
            render();
        }

        document.getElementById('sell-form').addEventListener('submit', (e) => {
            e.preventDefault();
            marketItems.unshift({
                name: document.getElementById('s-name').value,
                wear: document.getElementById('s-wear').value,
                img: document.getElementById('s-img').value,
                price: Number(document.getElementById('s-price').value)
            });
            render();
            switchTab('market', document.querySelector('.nav-item'));
            e.target.reset();
        });

        render();
    </script>
</body>
</html>
