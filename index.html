<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOPLAY - Мем-Маркет</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f131a;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Шапка сайта (Header как на stoplay) */
        header {
            background-color: #151a23;
            border-bottom: 1px solid #232b38;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            color: #38bdf8;
        }
        
        .user-panel {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .balance-box {
            background: #1e2532;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            font-weight: bold;
            color: #4ade80;
            font-size: 0.95rem;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
        }

        /* Основной контент */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #f8fafc;
        }
        .page-subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        /* Секции страниц */
        .content-section {
            display: none;
        }
        .content-section.active {
            display: block;
        }

        /* Сетка товаров/мемов */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .item-card {
            background: #151a23;
            border-radius: 12px;
            border: 1px solid #232b38;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .item-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }
        .item-img-wrap {
            width: 100%;
            height: 220px;
            background: #0f131a;
            position: relative;
        }
        .item-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .item-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #f1f5f9;
        }
        .item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }
        .item-price {
            font-size: 1.15rem;
            font-weight: 800;
            color: #4ade80;
        }
        .btn-buy {
            background-color: #38bdf8;
            color: #0f131a;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-buy:hover {
            background-color: #0ea5e9;
        }

        /* Форма предложения мема (стиль модалки/карточки) */
        .sell-form-card {
            background: #151a23;
            border: 1px solid #232b38;
            border-radius: 16px;
            padding: 30px;
            max-width: 550px;
            margin: 0 auto;
        }
        .sell-form-card h3 {
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            background: #0f131a;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .form-group input:focus {
            border-color: #38bdf8;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            background: #4ade80;
            color: #0f131a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #22c55e;
        }

        /* Профиль */
        .profile-box {
            background: #151a23;
            border: 1px solid #232b38;
            border-radius: 16px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            max-width: 600px;
            margin: 0 auto;
        }
        .profile-box img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
        }
        .profile-details h2 {
            margin-bottom: 5px;
        }
        .profile-details p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Шапка сайта в стиле STOPLAY -->
    <header>
        <div class="logo-area">
            <div class="logo">⚡ STOPLAY</div>
        </div>
        <div class="nav-links">
            <span class="nav-link active" onclick="switchTab('market', this)">Маркет</span>
            <span class="nav-link" onclick="switchTab('add', this)">Продать / Предложить</span>
            <span class="nav-link" onclick="switchTab('profile', this)">Профиль</span>
        </div>
        <div class="user-panel">
            <div class="balance-box" id="header-balance">12,450 ₽</div>
            <img src="https://i.ibb.co/s4bnZ6s/IMG-7691.jpg" alt="Avatar" class="user-avatar">
        </div>
    </header>

    <div class="main-container">

        <!-- РАЗДЕЛ 1: МАРКЕТ (СЕТКА МЕМОВ) -->
        <div id="section-market" class="content-section active">
            <div class="page-title">Трендовый Маркет Мемов</div>
            <div class="page-subtitle">Живые котировки и покупка лучших активов площадки</div>
            <div class="market-grid" id="market-container">
                <!-- Заполняется JS -->
            </div>
        </div>

        <!-- РАЗДЕЛ 2: ФОРМА ДОБАВЛЕНИЯ (ПРЕДЛОЖИТЬ МЕМ) -->
        <div id="section-add" class="content-section">
            <div class="sell-form-card">
                <h3>Выставить мем на биржу</h3>
                <form id="memeForm">
                    <div class="form-group">
                        <label>Ваш Ник / Автор:</label>
                        <input type="text" id="author" placeholder="Trader_228" required>
                    </div>
                    <div class="form-group">
                        <label>Название мема:</label>
                        <input type="text" id="memeName" placeholder="Например: Плачущий Джедай" required>
                    </div>
                    <div class="form-group">
                        <label>Прямая ссылка на картинку (URL):</label>
                        <input type="url" id="memeImg" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>Стартовая цена (₽):</label>
                        <input type="number" id="memePrice" placeholder="500" required>
                    </div>
                    <button type="submit" class="btn-submit">Опубликовать на маркете</button>
                </form>
            </div>
        </div>

        <!-- РАЗДЕЛ 3: ПРОФИЛЬ -->
        <div id="section-profile" class="content-section">
            <div class="profile-box">
                <img src="https://i.ibb.co/s4bnZ6s/IMG-7691.jpg" alt="Avatar">
                <div class="profile-details">
                    <h2>TrandMaster</h2>
                    <p>Telegram ID: 8441052897</p>
                    <p>Статус аккаунта: <span style="color: #4ade80; font-weight: bold;">Верифицирован</span></p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Переключение вкладок (меню сверху)
        function switchTab(tabName, element) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));

            document.getElementById('section-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        // Список мемов (включая ваше фото с джедаем)
        let memes = [
            { name: "Плачущий Джедай", price: 999, img: "https://i.ibb.co/s4bnZ6s/IMG-7691.jpg" },
            { name: "Крипто-Догэ", price: 340, img: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400" },
            { name: "Трейдер в шоке", price: 180, img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400" }
        ];

        let balance = 12450;
        const container = document.getElementById('market-container');
        const balanceEl = document.getElementById('header-balance');

        function renderMarket() {
            container.innerHTML = '';
            memes.forEach((meme, index) => {
                container.innerHTML += `
                    <div class="item-card">
                        <div class="item-img-wrap">
                            <img src="${meme.img}" alt="${meme.name}">
                        </div>
                        <div class="item-body">
                            <div class="item-title">${meme.name}</div>
                            <div class="item-footer">
                                <div class="item-price" id="price-${index}">${meme.price} ₽</div>
                                <button class="btn-buy" onclick="buyItem('${meme.name}', ${meme.price})">Купить</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function buyItem(name, price) {
            alert(`Вы успешно приобрели лот "${name}" за ${price} ₽!`);
        }

        // Авто-изменение цен (биржа)
        setInterval(() => {
            memes.forEach((meme, index) => {
                const change = Math.floor(Math.random() * 21) - 10;
                meme.price = Math.max(50, meme.price + change);
                const priceEl = document.getElementById(`price-${index}`);
                if (priceEl) {
                    priceEl.innerText = `${meme.price} ₽`;
                }
            });
        }, 4000);

        renderMarket();

        // Отправка формы в Telegram и добавление на сайт
        document.getElementById('memeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const author = document.getElementById('author').value;
            const memeName = document.getElementById('memeName').value;
            const memeImg = document.getElementById('memeImg').value;
            const memePrice = Number(document.getElementById('memePrice').value);

            memes.unshift({ name: memeName, price: memePrice, img: memeImg });
            renderMarket();
            switchTab('market', document.querySelector('.nav-link'));

            const botToken = '9083035411:AAEo4hVsmfPqqGXflBhgJawoyrQ84rF4uV8';
            const chatId = '8441052897';
            const message = `🔥 Новый мем на STOPLAY!\n👤 Автор: ${author}\n🖼 Название: ${memeName}\n💰 Цена: ${memePrice} ₽\n🔗 Картинка: ${memeImg}`;

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: message })
                });
                alert('Мем успешно опубликован на маркете и отправлен в Telegram!');
                document.getElementById('memeForm').reset();
            } catch (err) {
                alert('Мем добавлен на сайт, но произошла ошибка при отправке в Telegram.');
            }
        });
    </script>
</body>
</html>
