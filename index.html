<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOPLAY - Маркет Мемов</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f17;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Шапка в стиле Stoplay */
        header {
            background-color: #121824;
            border-bottom: 1px solid #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-icon {
            color: #f59e0b;
            font-size: 1.2rem;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            gap: 15px;
        }
        .nav-link {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .nav-link:hover, .nav-link.active {
            color: #38bdf8;
        }
        
        .user-panel {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .balance-box {
            background: #192231;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #2a3649;
            font-weight: 700;
            color: #4ade80;
            font-size: 0.85rem;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
        }

        /* Контент */
        .main-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: #f8fafc;
        }
        .page-subtitle {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .content-section {
            display: none;
        }
        .content-section.active {
            display: block;
        }

        /* СЕТКА ТОВАРОВ ПО 2 В РЯД (КАК НА STOPLAY) */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .item-card {
            background: #141b26;
            border-radius: 10px;
            border: 1px solid #1e293b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }
        .item-card:hover {
            border-color: #38bdf8;
        }
        .item-img-wrap {
            width: 100%;
            height: 140px;
            background: #0b0f17;
            position: relative;
        }
        .item-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .item-title {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .item-price {
            font-size: 0.95rem;
            font-weight: 800;
            color: #4ade80;
        }
        .btn-buy {
            background-color: #38bdf8;
            color: #0b0f17;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-buy:hover {
            background-color: #0ea5e9;
        }

        /* Форма добавления */
        .sell-form-card {
            background: #141b26;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
        }
        .sell-form-card h3 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2a3649;
            background: #0b0f17;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        .btn-submit {
            width: 100%;
            background: #4ade80;
            color: #0b0f17;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 5px;
        }

        /* Профиль */
        .profile-box {
            background: #141b26;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .profile-box img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
        }
        .profile-details h2 {
            font-size: 1.1rem;
            margin-bottom: 3px;
        }
        .profile-details p {
            color: #64748b;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo-area">
            <span class="logo-icon">⚡</span>
            <div class="logo">STOPLAY</div>
        </div>
        <div class="nav-links">
            <span class="nav-link active" onclick="switchTab('market', this)">Маркет</span>
            <span class="nav-link" onclick="switchTab('add', this)">Продать</span>
            <span class="nav-link" onclick="switchTab('profile', this)">Профиль</span>
        </div>
        <div class="user-panel">
            <div class="balance-box" id="header-balance">12,450 ₽</div>
            <img src="https://i.ibb.co/s4bnZ6s/IMG-7691.jpg" alt="Avatar" class="user-avatar">
        </div>
    </header>

    <div class="main-container">

        <!-- МАРКЕТ -->
        <div id="section-market" class="content-section active">
            <div class="page-title">Маркет Мемов</div>
            <div class="page-subtitle">Живые котировки рынка активов</div>
            <div class="market-grid" id="market-container">
                <!-- Заполняется JS -->
            </div>
        </div>

        <!-- ПРОДАТЬ / ПРЕДЛОЖИТЬ -->
        <div id="section-add" class="content-section">
            <div class="sell-form-card">
                <h3>Выставить мем</h3>
                <form id="memeForm">
                    <div class="form-group">
                        <label>Ваш Ник:</label>
                        <input type="text" id="author" placeholder="Trader_228" required>
                    </div>
                    <div class="form-group">
                        <label>Название мема:</label>
                        <input type="text" id="memeName" placeholder="Плачущий Джедай" required>
                    </div>
                    <div class="form-group">
                        <label>Ссылка на картинку (URL):</label>
                        <input type="url" id="memeImg" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>Цена (₽):</label>
                        <input type="number" id="memePrice" placeholder="500" required>
                    </div>
                    <button type="submit" class="btn-submit">Опубликовать</button>
                </form>
            </div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="section-profile" class="content-section">
            <div class="profile-box">
                <img src="https://i.ibb.co/s4bnZ6s/IMG-7691.jpg" alt="Avatar">
                <div class="profile-details">
                    <h2>TrandMaster</h2>
                    <p>Telegram ID: 8441052897</p>
                    <p>Статус: <span style="color: #4ade80;">Активен</span></p>
                </div>
            </div>
        </div>

    </div>

    <script>
        function switchTab(tabName, element) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            document.getElementById('section-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        let memes = [
            { name: "Плачущий Джедай", price: 999, img: "https://i.ibb.co/s4bnZ6s/IMG-7691.jpg" },
            { name: "Крипто-Догэ", price: 340, img: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400" },
            { name: "Трейдер в шоке", price: 180, img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400" },
            { name: "Холдер", price: 520, img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=400" }
        ];

        const container = document.getElementById('market-container');

        function renderMarket() {
            container.innerHTML = '';
            memes.forEach((meme, index) => {
                container.innerHTML += `
                    <div class="item-card">
                        <div class="item-img-wrap">
                            <img src="${meme.img}" alt="${meme.name}">
                        </div>
                        <div class="item-body">
                            <div class="item-title">${meme.name}</div>
                            <div class="item-footer">
                                <div class="item-price" id="price-${index}">${meme.price} ₽</div>
                                <button class="btn-buy" onclick="buyItem('${meme.name}', ${meme.price})">Купить</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function buyItem(name, price) {
            alert(`Вы приобрели "${name}" за ${price} ₽!`);
        }

        setInterval(() => {
            memes.forEach((meme, index) => {
                const change = Math.floor(Math.random() * 21) - 10;
                meme.price = Math.max(50, meme.price + change);
                const priceEl = document.getElementById(`price-${index}`);
                if (priceEl) {
                    priceEl.innerText = `${meme.price} ₽`;
                }
            });
        }, 4000);

        renderMarket();

        document.getElementById('memeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const author = document.getElementById('author').value;
            const memeName = document.getElementById('memeName').value;
            const memeImg = document.getElementById('memeImg').value;
            const memePrice = Number(document.getElementById('memePrice').value);

            memes.unshift({ name: memeName, price: memePrice, img: memeImg });
            renderMarket();
            switchTab('market', document.querySelector('.nav-link'));

            const botToken = '9083035411:AAEo4hVsmfPqqGXflBhgJawoyrQ84rF4uV8';
            const chatId = '8441052897';
            const message = `🔥 Новый лот на STOPLAY!\n👤 Автор: ${author}\n🖼 Название: ${memeName}\n💰 Цена: ${memePrice} ₽\n🔗 Картинка: ${memeImg}`;

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: message })
                });
                alert('Лот успешно выставлен на маркет и отправлен в Telegram!');
                document.getElementById('memeForm').reset();
            } catch (err) {
                alert('Лот добавлен на сайт, но произошла ошибка при отправке в Telegram.');
            }
        });
    </script>
</body>
</html>
