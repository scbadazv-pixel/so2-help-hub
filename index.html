<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мем-Биржа HUB</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { color: #94a3b8; margin-bottom: 30px; }
        
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            width: 260px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        .card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
        }
        .price {
            font-size: 1.35rem;
            color: #4ade80;
            font-weight: bold;
            margin: 12px 0;
        }
        button {
            background-color: #38bdf8;
            color: #0b0f19;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
        }

        /* Форма предложения мема */
        .form-section {
            background: #1e293b;
            max-width: 450px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: left;
        }
        .form-section h3 {
            color: #38bdf8;
            text-align: center;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>📈 Мем-Биржа HUB</h1>
    <p class="subtitle">Инвестируйте в тренды и предлагайте свои шедевры!</p>

    <!-- Сетка мемов -->
    <div class="grid" id="memes-container">
        <!-- Заполняется через JS -->
    </div>

    <!-- Форма отправки мема в Telegram -->
    <div class="form-section">
        <h3>Предложить свой мем</h3>
        <form id="memeForm">
            <div class="form-group">
                <label>Ваше имя / Ник:</label>
                <input type="text" id="author" placeholder="Например: Trader_228" required>
            </div>
            <div class="form-group">
                <label>Название мема:</label>
                <input type="text" id="memeName" placeholder="Например: Плачущий Джедай" required>
            </div>
            <div class="form-group">
                <label>Ссылка на картинку (URL):</label>
                <input type="url" id="memeImg" placeholder="https://..." required>
            </div>
            <div class="form-group">
                <label>Желаемая стартовая цена (₽):</label>
                <input type="number" id="memePrice" placeholder="500" required>
            </div>
            <button type="submit">Добавить мем на биржу</button>
        </form>
    </div>

    <script>
        // Стартовый список мемов с вашей картинкой джедая
        const memes = [
            { 
                name: "Плачущий Джедай", 
                price: 999, 
                img: "https://i.ibb.co/s4bnZ6s/IMG-7691.jpg[span_2](start_span)"[span_2](end_span)
            },
            { name: "Классический Дог", price: 300, img: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400" },
            { name: "Удивленный кот", price: 150, img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400" }
        ];

        const container = document.getElementById('memes-container');

        function renderMemes() {
            container.innerHTML = '';
            memes.forEach((meme, index) => {
                container.innerHTML += `
                    <div class="card">
                        <img src="${meme.img}" alt="${meme.name}">
                        <h3>${meme.name}</h3>
                        <div class="price" id="price-${index}">${meme.price} ₽</div>
                        <button onclick="buyMeme('${meme.name}', ${meme.price})">Купить мем</button>
                    </div>
                `;
            });
        }

        function buyMeme(name, price) {
            alert(`Успешно! Вы приобрели мем "${name}" за ${price}₽.`);
        }

        // Автоматическое изменение цен раз в 4 секунды (имитация биржи)
        setInterval(() => {
            memes.forEach((meme, index) => {
                const change = Math.floor(Math.random() * 21) - 10;
                meme.price = Math.max(50, meme.price + change);
                const priceEl = document.getElementById(`price-${index}`);
                if (priceEl) {
                    priceEl.innerText = `${meme.price} ₽`;
                }
            });
        }, 4000);

        renderMemes();

        // Отправка данных из формы в ваш Telegram-бот и добавление на сайт
        document.getElementById('memeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const author = document.getElementById('author').value;
            const memeName = document.getElementById('memeName').value;
            const memeImg = document.getElementById('memeImg').value;
            const memePrice = Number(document.getElementById('memePrice').value);

            // Добавляем новый мем на сайт
            memes.push({ name: memeName, price: memePrice, img: memeImg });
            renderMemes();

            // Данные вашего Telegram-бота
            const botToken = '9083035411:AAEo4hVsmfPqqGXflBhgJawoyrQ84rF4uV8[span_3](start_span)'[span_3](end_span);
            const chatId = '8441052897[span_4](start_span)'[span_4](end_span);

            const message = `🔥 Новый мем добавлен на биржу!\n👤 Автор: ${author}\n🖼 Название: ${memeName}\n💰 Цена: ${memePrice} ₽\n🔗 Картинка: ${memeImg}`;

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });
                alert('Мем успешно добавлен на биржу и отправлен в Telegram!');
                document.getElementById('memeForm').reset();
            } catch (error) {
                alert('Мем добавлен на сайт, но произошла ошибка при отправке в Telegram.');
            }
        });
    </script>

</body>
</html>
